<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jacqueline Babcock — Cover Letter</title>
    <style>
      @page {
        size: letter;
        margin: 0.7in 0.85in 0.7in;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
        color: #000;
        font-family: Calibri, "Segoe UI", Arial, sans-serif;
        font-size: 11pt;
        line-height: 1.28;
      }
      .header {
        margin: 0 0 0.22in;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.05in;
        font-size: 16pt;
        font-weight: 700;
      }
      .contact {
        margin: 0;
        font-size: 10.5pt;
      }
      .meta {
        margin: 0 0 0.18in;
      }
      .meta p {
        margin: 0;
      }
      .letter p {
        margin: 0 0 0.14in;
      }
      .body-slot {
        min-height: 0.9in;
      }
      .close {
        margin: 0.22in 0 0;
      }
      .close p {
        margin: 0;
      }
      .sign-name {
        margin: 0.16in 0 0.04in;
        font-weight: 700;
      }
      .sign-contact {
        margin: 0;
        font-size: 10.5pt;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Jacqueline Babcock</h1>
      <p class="contact">
        Brooklyn, NY 11237 | Jacquelinebabc@gmail.com | (620) 617-1833
      </p>
    </div>

    <div class="meta">
      <p>[Date]</p>
      <p>[Hiring Manager Name]</p>
      <p>[Company Name]</p>
      <p>[City, ST]</p>
    </div>

    <div class="letter">
      <p>Dear [Name],</p>
      <p class="body-slot">[Paragraph]</p>
      <p class="body-slot">[Paragraph]</p>
      <p class="body-slot">[Paragraph]</p>
    </div>

    <div class="close">
      <p>Sincerely,</p>
      <p class="sign-name">Jacqueline Babcock</p>
      <p class="sign-contact">
        Brooklyn, NY 11237 | Jacquelinebabc@gmail.com | (620) 617-1833
      </p>
    </div>
  </body>
</html>
