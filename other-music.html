<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Other tracks — Jacqueline Babcock." />
    <title>Other Music — Jacqueline Babcock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <main id="main" class="project-page">
      <p class="back-link"><a href="index.html#music">← Music</a></p>
      <h1>Other</h1>
      <p class="lede">Additional tracks.</p>

      <ul class="track-list">
        <li class="track">
          <span class="track__title">Bathroom</span>
          <audio controls preload="metadata">
            <source src="Music/Other/Bathroom.wav" type="audio/wav" />
          </audio>
        </li>
        <li class="track">
          <span class="track__title">City</span>
          <audio controls preload="metadata">
            <source src="Music/Other/City.wav" type="audio/wav" />
          </audio>
        </li>
        <li class="track">
          <span class="track__title">Country</span>
          <audio controls preload="metadata" data-gain="1.72">
            <source src="Music/Other/Country.m4a" type="audio/mp4" />
          </audio>
        </li>
        <li class="track">
          <span class="track__title">Field</span>
          <audio controls preload="metadata">
            <source src="Music/Other/field.wav" type="audio/wav" />
          </audio>
        </li>
        <li class="track">
          <span class="track__title">Rest</span>
          <audio controls preload="metadata">
            <source src="Music/Other/Rest.wav" type="audio/wav" />
          </audio>
        </li>
        <li class="track">
          <span class="track__title">Silly</span>
          <audio controls preload="metadata">
            <source src="Music/Other/Silly.wav" type="audio/wav" />
          </audio>
        </li>
      </ul>
    </main>

    <script>
      // Boost m4a playback (WAV files were amplified on disk).
      document.querySelectorAll("audio[data-gain]").forEach((audio) => {
        const gainValue = Number(audio.dataset.gain) || 1;
        let connected = false;
        const connect = () => {
          if (connected) return;
          connected = true;
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const source = ctx.createMediaElementSource(audio);
          const gain = ctx.createGain();
          gain.gain.value = gainValue;
          source.connect(gain);
          gain.connect(ctx.destination);
          if (ctx.state === "suspended") ctx.resume();
        };
        audio.addEventListener("play", connect, { once: true });
      });
    </script>
  </body>
</html>
